name: wf-cd-develop
on:
  push:
    branches:
      - develop
jobs:
  upload-artifact-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Website With Parcel 
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name: upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-develop"
  deploy-artifact-develop:
    needs: "upload-artifact-develop"
    runs-on: ubuntu-latest
    environment:
      name: "develop-env"
    permissions:
      pages: write
      id-token: write 
    steps:
      - name: Deploy Artifacts on GH Pages 
        uses: actions/deploy-pages@v4 
        with:
          artifact_name: "build-artifact-develop"
          token: "${{github.token}}"      
      